<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA版營運日報</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fdf6e3; color: #333; font-family: 'Segoe UI', sans-serif; padding: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; color: #2c2c2c; }
    .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; border-top: 3px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card:nth-child(1) { border-top-color: #7c6af7; }
    .card:nth-child(2) { border-top-color: #3b9eff; }
    .card:nth-child(3) { border-top-color: #f5a623; }
    .card:nth-child(4) { border-top-color: #4cd964; }
    .card-label { font-size: 13px; color: #888; margin-bottom: 8px; }
    .card-value { font-size: 30px; font-weight: 700; color: #2c2c2c; }
    .card-icon { font-size: 22px; margin-bottom: 8px; }
    .section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #444; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th { text-align: left; padding: 8px 12px; color: #999; font-weight: 500; border-bottom: 1px solid #f0e8d0; }
    td { padding: 10px 12px; border-bottom: 1px solid #f5efe0; color: #333; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fffbf0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .compare-cards { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .ccard { border-radius: 12px; padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .ccard.current { background: #ede9fe; border-left: 5px solid #7c3aed; }
    .ccard.prev { background: #fff; border: 1px solid #e2d9b3; }
    .ccard-label { font-size: 13px; font-weight: 600; margin-bottom: 12px; }
    .ccard.current .ccard-label { color: #5b21b6; }
    .ccard.prev .ccard-label { color: #92400e; }
    .ccard-main { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .ccard-value { font-size: 34px; font-weight: 700; }
    .ccard.current .ccard-value { color: #3730a3; }
    .ccard.prev .ccard-value { color: #2c2c2c; }
    .ccard-unit { font-size: 13px; font-weight: 500; }
    .ccard.current .ccard-unit { color: #6d28d9; }
    .ccard.prev .ccard-unit { color: #92400e; }
    .ccard-change { font-size: 20px; font-weight: 700; }
    .change-up { color: #16a34a; }
    .change-down { color: #dc2626; }
  </style>
</head>
<body>

<h1>🏦 SEA版營運日報</h1>
<div class="subtitle" id="subtitle">載入中...</div>

<div class="cards">
  <div class="card"><div class="card-icon">👥</div><div class="card-label">付費人數</div><div class="card-value" id="payingUsers">-</div></div>
  <div class="card"><div class="card-icon">💳</div><div class="card-label">交易筆數</div><div class="card-value" id="transactions">-</div></div>
  <div class="card"><div class="card-icon">💰</div><div class="card-label">總營收</div><div class="card-value" id="revenue">-</div></div>
  <div class="card"><div class="card-icon">📈</div><div class="card-label">ARPPU</div><div class="card-value" id="arppu">-</div></div>
</div>

<div class="section">
  <div class="section-title">👑 VIP 付費分析</div>
  <table>
    <thead><tr><th>VIP</th><th class="num">付費人數</th><th class="num">交易筆數</th><th class="num">總儲值</th></tr></thead>
    <tbody id="vipTable"></tbody>
  </table>
</div>

<div class="section">
  <div class="section-title">💳 儲值品項分析</div>
  <table>
    <thead><tr><th>品項</th><th class="num">付費人數</th><th class="num">金額</th><th class="num">佔比</th></tr></thead>
    <tbody id="saleTable"></tbody>
  </table>
</div>

<div class="section">
  <div class="section-title">📊 月份同期比較</div>
  <div class="compare-cards">

    <!-- 付費人數 -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrPaying">本月平均付費人數</div>
      <div class="ccard-main">
        <span class="ccard-value" id="mayPaying">-</span>
        <span class="ccard-unit">人 / 日</span>
        <span class="ccard-change" id="payingChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="labelPrevPaying">上月同期付費人數</div>
      <div class="ccard-main">
        <span class="ccard-value" id="aprPaying">-</span>
        <span class="ccard-unit">人 / 日</span>
      </div>
    </div>

    <!-- ARPPU -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrArppu">本月平均 ARPPU</div>
      <div class="ccard-main">
        <span class="ccard-value" id="mayArppu">-</span>
        <span class="ccard-unit">元 / 人</span>
        <span class="ccard-change" id="arppuChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="labelPrevArppu">上月同期 ARPPU</div>
      <div class="ccard-main">
        <span class="ccard-value" id="aprArppu">-</span>
        <span class="ccard-unit">元 / 人</span>
      </div>
    </div>

    <!-- 流水 -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrRevenue">本月累計流水</div>
      <div class="ccard-main">
        <span class="ccard-value" id="currRevenue">-</span>
        <span class="ccard-change" id="revenueChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="labelPrevRevenue">上月同期流水</div>
      <div class="ccard-main">
        <span class="ccard-value" id="prevRevenue">-</span>
      </div>
    </div>

  </div>
</div>

<script>
const saleTypeNames = {
  1:'一般商店', 2:'首購包', 3:'再銷包', 4:'WEB金流', 5:'社交包',
  6:'產包', 7:'付費蛋', 8:'小額付費', 9:'定製禮包', 10:'TACO',
  11:'CRM禮包', 12:'Web產包', 13:'登入禮包'
};

function fmt(n) { return Number(n).toLocaleString('en-US'); }
function fmtD(n) { return Number(n).toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1}); }
function pct(a, b) {
  if (!b) return '';
  const diff = ((a - b) / b * 100).toFixed(1);
  const cls = diff >= 0 ? 'change-up' : 'change-down';
  return `<span class="${cls}">${diff >= 0 ? '+' : ''}${diff}%</span>`;
}
function pctDirect(val) {
  if (val === undefined || val === null) return '';
  const cls = val >= 0 ? 'change-up' : 'change-down';
  return `<span class="${cls}">${val >= 0 ? '+' : ''}${val}%</span>`;
}

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => {
    document.getElementById('subtitle').textContent = '資料日期：' + d.date;
    document.getElementById('payingUsers').textContent = fmt(d.daily.PayingUsers);
    document.getElementById('transactions').textContent = fmt(d.daily.Transactions);
    document.getElementById('revenue').textContent = fmt(Math.round(d.daily.Revenue));
    document.getElementById('arppu').textContent = fmtD(d.daily.ARPPU);

    const vipOrder = [9,8,7,5,3,2,1,0];
    document.getElementById('vipTable').innerHTML = vipOrder.map(v => {
      const row = d.vip.find(r => Number(r.VipLV) === v) || {};
      return `<tr>
        <td>VIP ${v}</td>
        <td class="num">${fmt(row.PayingUsers||0)}</td>
        <td class="num">${fmt(row.Transactions||0)}</td>
        <td class="num">${fmt(Math.round(row.Revenue||0))}</td>
      </tr>`;
    }).join('');

    document.getElementById('saleTable').innerHTML = (d.saleType||[]).map(r => `<tr>
      <td>${saleTypeNames[r.SaleType] || r.SaleType}</td>
      <td class="num">${fmt(r.paying_users)}</td>
      <td class="num">${fmt(Math.round(r.total_amount))}</td>
      <td class="num">${r.revenue_percentage}%</td>
    </tr>`).join('');

    if (d.comparison) {
      const c = d.comparison;
      const cm = c.curr_month || '本月';
      const pm = c.prev_month || '上月';

      // 動態標籤
      document.getElementById('labelCurrPaying').textContent  = cm + '平均付費人數';
      document.getElementById('labelPrevPaying').textContent  = pm + '同期付費人數';
      document.getElementById('labelCurrArppu').textContent   = cm + '平均 ARPPU';
      document.getElementById('labelPrevArppu').textContent   = pm + '同期 ARPPU';
      document.getElementById('labelCurrRevenue').textContent = cm + '累計流水';
      document.getElementById('labelPrevRevenue').textContent = pm + '同期流水';

      // 數值
      document.getElementById('mayPaying').textContent  = fmt(c.may_avg_paying);
      document.getElementById('aprPaying').textContent  = fmt(c.apr_avg_paying);
      document.getElementById('mayArppu').textContent   = '$' + fmt(c.may_avg_arppu);
      document.getElementById('aprArppu').textContent   = '$' + fmt(c.apr_avg_arppu);
      document.getElementById('currRevenue').textContent = fmt(c.curr_revenue);
      document.getElementById('prevRevenue').textContent = fmt(c.prev_revenue);

      // 變化率
      document.getElementById('payingChange').innerHTML  = pct(c.may_avg_paying, c.apr_avg_paying);
      document.getElementById('arppuChange').innerHTML   = pct(c.may_avg_arppu, c.apr_avg_arppu);
      document.getElementById('revenueChange').innerHTML = pctDirect(c.revenue_growth_pct);
    }
  });
</script>
</body>
</html>
