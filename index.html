<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEA版營運日報</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fdf6e3; color: #333; font-family: 'Segoe UI', sans-serif; padding: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; color: #2c2c2c; }
    .subtitle { color: #999; font-size: 14px; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
    .card { background: #fff; border-radius: 12px; padding: 20px; border-top: 3px solid #ddd; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .card:nth-child(1) { border-top-color: #7c6af7; }
    .card:nth-child(2) { border-top-color: #3b9eff; }
    .card:nth-child(3) { border-top-color: #f5a623; }
    .card:nth-child(4) { border-top-color: #4cd964; }
    .card-label { font-size: 13px; color: #888; margin-bottom: 8px; }
    .card-value { font-size: 30px; font-weight: 700; color: #2c2c2c; }
    .card-icon { font-size: 22px; margin-bottom: 8px; }
    .card-diff { font-size: 13px; font-weight: 700; margin-top: 6px; }
    .diff-up { color: #16a34a; }
    .diff-down { color: #dc2626; }
    .section { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .section-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; color: #444; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th { text-align: left; padding: 8px 12px; color: #999; font-weight: 500; border-bottom: 1px solid #f0e8d0; }
    td { padding: 10px 12px; border-bottom: 1px solid #f5efe0; color: #333; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fffbf0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .compare-cards { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; }
    .ccard { border-radius: 12px; padding: 14px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .ccard.current { background: #ede9fe; border-left: 4px solid #7c3aed; }
    .ccard.prev { background: #fff; border: 1px solid #e2d9b3; }
    .ccard-label { font-size: 11px; font-weight: 600; margin-bottom: 10px; }
    .ccard.current .ccard-label { color: #5b21b6; }
    .ccard.prev .ccard-label { color: #92400e; }
    .ccard-main { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
    .ccard-value { font-size: 22px; font-weight: 700; }
    .ccard.current .ccard-value { color: #3730a3; }
    .ccard.prev .ccard-value { color: #2c2c2c; }
    .ccard-unit { font-size: 11px; font-weight: 500; }
    .ccard.current .ccard-unit { color: #6d28d9; }
    .ccard.prev .ccard-unit { color: #92400e; }
    .ccard-change { font-size: 13px; font-weight: 700; }
    .change-up { color: #16a34a; }
    .change-down { color: #dc2626; }
    .currency-badge { position: fixed; top: 16px; right: 20px; display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e2d9b3; border-radius: 10px; padding: 4px 6px; font-size: 13px; font-weight: 600; z-index: 999; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .currency-badge span { color: #aaa; font-size: 12px; margin-right: 2px; }
    .cur-btn { border: none; border-radius: 7px; padding: 5px 14px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .cur-btn.active { background: #7c3aed; color: #fff; }
    .cur-btn:not(.active) { background: transparent; color: #999; }
    .cur-btn:not(.active):hover { background: #f3f0ff; color: #7c3aed; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 24px; }
    .two-col .section { margin-bottom: 0; }
    .stc-table th.apr-header { background: #fef9ec; color: #92400e; text-align: right; }
    .stc-table th.may-header { background: #ede9fe; color: #5b21b6; text-align: right; }
    .stc-table th.change-header { text-align: right; color: #999; }
    .stc-table td.apr-cell { background: #fef9ec; text-align: right; }
    .stc-table td.may-cell { background: #ede9fe; text-align: right; font-weight: 600; }
    .stc-table td.change-cell { text-align: right; font-weight: 700; }
  </style>
</head>
<body>

<div class="currency-badge">
  <span>金額</span>
  <button class="cur-btn" id="btnTWD" onclick="setCurrency('TWD')">台幣</button>
  <button class="cur-btn active" id="btnMYR" onclick="setCurrency('MYR')">馬幣</button>
</div>
<h1>🏦 SEA版營運日報</h1>
<div class="subtitle" id="subtitle">載入中...</div>

<div class="cards">
  <div class="card"><div class="card-icon">👥</div><div class="card-label">付費人數</div><div class="card-value" id="payingUsers">-</div><div class="card-diff" id="payingUsersDiff"></div></div>
  <div class="card"><div class="card-icon">💳</div><div class="card-label">交易筆數</div><div class="card-value" id="transactions">-</div><div class="card-diff" id="transactionsDiff"></div></div>
  <div class="card"><div class="card-icon">💰</div><div class="card-label">總營收</div><div class="card-value" id="revenue">-</div><div class="card-diff" id="revenueDiff"></div></div>
  <div class="card"><div class="card-icon">📈</div><div class="card-label">ARPPU</div><div class="card-value" id="arppu">-</div><div class="card-diff" id="arppuDiff"></div></div>
</div>

<div class="two-col">
  <div class="section">
    <div class="section-title">👑 VIP 付費分析</div>
    <table>
      <thead><tr><th>VIP</th><th class="num">付費人數</th><th class="num">交易筆數</th><th class="num">總儲值</th></tr></thead>
      <tbody id="vipTable"></tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-title">💳 儲值品項分析</div>
    <table>
      <thead><tr><th>品項</th><th class="num">付費人數</th><th class="num">金額</th><th class="num">佔比</th></tr></thead>
      <tbody id="saleTable"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-title">📊 月份同期比較</div>
  <div class="compare-cards">
    <!-- 付費人數 -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrPaying">本月平均付費人數</div>
      <div class="ccard-main">
        <span class="ccard-value" id="mayPaying">-</span>
        <span class="ccard-unit">人/日</span>
        <span class="ccard-change" id="payingChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="labelPrevPaying">上月同期付費人數</div>
      <div class="ccard-main">
        <span class="ccard-value" id="aprPaying">-</span>
        <span class="ccard-unit">人/日</span>
      </div>
    </div>
    <!-- ARPPU -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrArppu">本月平均 ARPPU</div>
      <div class="ccard-main">
        <span class="ccard-value" id="mayArppu">-</span>
        <span class="ccard-unit">元/人</span>
        <span class="ccard-change" id="arppuChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="labelPrevArppu">上月同期 ARPPU</div>
      <div class="ccard-main">
        <span class="ccard-value" id="aprArppu">-</span>
        <span class="ccard-unit">元/人</span>
      </div>
    </div>
    <!-- 社交玩家儲值 -->
    <div class="ccard current">
      <div class="ccard-label" id="socialLabelCurrRev">社交玩家儲值</div>
      <div class="ccard-main">
        <span class="ccard-value" id="socialCurrRevenue">-</span>
        <span class="ccard-change" id="socialRevenueChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="socialLabelPrevRev">上月同期儲值</div>
      <div class="ccard-main">
        <span class="ccard-value" id="socialPrevRevenue">-</span>
      </div>
    </div>
    <!-- 扣除社交後流水（僅當月，不做同期比較） -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrExSocial">扣除社交後流水</div>
      <div class="ccard-main">
        <span class="ccard-value" id="currExSocial">-</span>
        <span class="ccard-change" id="exSocialChange"></span>
      </div>
    </div>
    <!-- 累計流水 -->
    <div class="ccard current">
      <div class="ccard-label" id="labelCurrRevenue">本月累計流水</div>
      <div class="ccard-main">
        <span class="ccard-value" id="currRevenue">-</span>
        <span class="ccard-change" id="revenueChange"></span>
      </div>
    </div>
    <div class="ccard prev">
      <div class="ccard-label" id="labelPrevRevenue">上月同期流水</div>
      <div class="ccard-main">
        <span class="ccard-value" id="prevRevenue">-</span>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="section-title">🏪 月份同期儲值品項比較</div>
  <table class="stc-table">
    <thead>
      <tr>
        <th>品項</th>
        <th class="apr-header" id="stcAprLabel1">4月付費人數</th>
        <th class="may-header" id="stcMayLabel1">5月付費人數</th>
        <th class="change-header">付費人數變化</th>
        <th class="apr-header" id="stcAprLabel2">4月流水</th>
        <th class="may-header" id="stcMayLabel2">5月流水</th>
        <th class="change-header">流水變化</th>
      </tr>
    </thead>
    <tbody id="stcTable"></tbody>
  </table>
</div>

<script>
const SALE_TYPE_NAMES = {
  1:'一般商店', 2:'首購包', 3:'再銷包', 4:'WEB金流', 5:'社交包',
  6:'產包', 7:'付費蛋', 8:'小額付費', 9:'定製禮包', 10:'TACO',
  11:'CRM禮包', 12:'Web產包', 13:'登入禮包'
};

const MYR_TO_TWD = 7.56;
let currentRate = 1;       // 預設馬幣
let cachedData  = null;

function n(v) { return parseFloat(v) || 0; }
function fmt(v) { return Math.round(n(v)).toLocaleString('en-US'); }
function fmtMoney(v) { return Math.round(n(v) * currentRate).toLocaleString('en-US'); }

function diffTag(curr, prev) {
  curr = n(curr); prev = n(prev);
  if (!prev) return '';
  const diff = curr - prev;
  const cls  = diff >= 0 ? 'diff-up' : 'diff-down';
  const arr  = diff >= 0 ? '↑' : '↓';
  return `<span class="${cls}">${arr} ${Math.abs(Math.round(diff)).toLocaleString('en-US')}</span>`;
}
function diffInline(curr, prev, isMoney = false) {
  curr = n(curr); prev = n(prev);
  if (!prev || curr === prev) return '';
  const diff = curr - prev;
  const cls  = diff > 0 ? 'diff-up' : 'diff-down';
  const arr  = diff > 0 ? '↑' : '↓';
  const val  = isMoney
    ? Math.abs(Math.round(diff * currentRate)).toLocaleString('en-US')
    : Math.abs(Math.round(diff)).toLocaleString('en-US');
  return `<span class="${cls}" style="font-size:11px;font-weight:700;margin-left:4px;">${arr}${val}</span>`;
}

function pct(curr, prev) {
  curr = n(curr); prev = n(prev);
  if (!prev) return '';
  const diff = ((curr - prev) / prev * 100).toFixed(1);
  const cls = diff >= 0 ? 'change-up' : 'change-down';
  return `<span class="${cls}">${diff >= 0 ? '+' : ''}${diff}%</span>`;
}
function pctDirect(val) {
  val = n(val);
  const cls = val >= 0 ? 'change-up' : 'change-down';
  return `<span class="${cls}">${val >= 0 ? '+' : ''}${val.toFixed(2)}%</span>`;
}
function changeCell(may, apr) {
  may = n(may); apr = n(apr);
  if (!apr) return '<span style="color:#bbb">—</span>';
  const diff = ((may - apr) / apr * 100).toFixed(1);
  const cls = diff >= 0 ? 'change-up' : 'change-down';
  return `<span class="${cls}">${diff >= 0 ? '▲' : '▼'}${Math.abs(diff)}%</span>`;
}

function setCurrency(cur) {
  currentRate = cur === 'TWD' ? MYR_TO_TWD : 1;
  document.getElementById('btnTWD').classList.toggle('active', cur === 'TWD');
  document.getElementById('btnMYR').classList.toggle('active', cur === 'MYR');
  if (cachedData) render(cachedData);
}

function render(d) {

  document.getElementById('subtitle').textContent = '資料日期：' + (d.date || '-');

  // VIP 去重
  const seenLv = new Set();
  const uniqueVip = (d.vip || []).filter(v => {
    const lv = String(v.VipLV);
    if (seenLv.has(lv)) return false;
    seenLv.add(lv);
    return true;
  }).filter(v => v.VipLV != 4 && v.VipLV != 6);

  // 四大指標（daily 為 0 時從 VIP 加總）
  let paying = n(d.daily && d.daily.PayingUsers);
  let trans  = n(d.daily && d.daily.Transactions);
  let rev    = n(d.daily && d.daily.Revenue);
  let arppu  = n(d.daily && d.daily.ARPPU);
  if (!paying && uniqueVip.length > 0) {
    paying = uniqueVip.reduce((s, v) => s + n(v.PayingUsers), 0);
    trans  = uniqueVip.reduce((s, v) => s + n(v.Transactions), 0);
    rev    = uniqueVip.reduce((s, v) => s + n(v.Revenue), 0);
    arppu  = paying > 0 ? Math.round(rev / paying) : 0;
  }
  document.getElementById('payingUsers').textContent  = fmt(paying);
  document.getElementById('transactions').textContent = fmt(trans);
  document.getElementById('revenue').textContent      = '$' + fmtMoney(rev);
  document.getElementById('arppu').textContent        = '$' + fmtMoney(arppu);

  // 與前天比較
  const pd = d.prevDay || {};
  document.getElementById('payingUsersDiff').innerHTML = diffTag(paying,       n(pd.PayingUsers));
  document.getElementById('transactionsDiff').innerHTML= diffTag(trans,        n(pd.Transactions));
  document.getElementById('revenueDiff').innerHTML     = diffTag(rev,          n(pd.Revenue));
  document.getElementById('arppuDiff').innerHTML       = diffTag(arppu,        n(pd.ARPPU));

  // VIP 表格
  const vipPrevMap = {};
  (d.vipPrev || []).forEach(v => { vipPrevMap[Number(v.VipLV)] = v; });
  const vipOrder = [9, 8, 7, 5, 3, 2, 1, 0];
  document.getElementById('vipTable').innerHTML = vipOrder.map(lv => {
    const row  = uniqueVip.find(r => Number(r.VipLV) === lv) || {};
    const prev = vipPrevMap[lv] || {};
    return `<tr>
      <td>VIP ${lv}</td>
      <td class="num">${fmt(row.PayingUsers || 0)}${diffInline(row.PayingUsers, prev.PayingUsers)}</td>
      <td class="num">${fmt(row.Transactions || 0)}${diffInline(row.Transactions, prev.Transactions)}</td>
      <td class="num">$${fmtMoney(row.Revenue || 0)}${diffInline(row.Revenue, prev.Revenue, true)}</td>
    </tr>`;
  }).join('');

  // 儲值品項表格
  const saleRows = d.saleType || [];
  const salePrevMap = {};
  (d.saleTypePrev || []).forEach(s => { salePrevMap[Number(s.SaleType)] = s; });
  document.getElementById('saleTable').innerHTML = saleRows.length
    ? saleRows.map(r => {
        const prev = salePrevMap[n(r.SaleType)] || {};
        return `<tr>
          <td>${SALE_TYPE_NAMES[n(r.SaleType)] || r.SaleType}</td>
          <td class="num">${fmt(r.paying_users)}${diffInline(r.paying_users, prev.paying_users)}</td>
          <td class="num">$${fmtMoney(r.total_amount)}${diffInline(r.total_amount, prev.total_amount, true)}</td>
          <td class="num">${n(r.revenue_percentage).toFixed(2)}%</td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="4" style="text-align:center;color:#bbb;padding:16px;">暫無資料</td></tr>';

  // 月份同期比較
  const c  = d.comparison || {};
  const pm = c.prev_month || '4月';
  const cm = c.curr_month || '5月';
  document.getElementById('labelCurrPaying').textContent  = cm + '平均付費人數';
  document.getElementById('labelPrevPaying').textContent  = pm + '同期付費人數';
  document.getElementById('labelCurrArppu').textContent   = cm + '平均 ARPPU';
  document.getElementById('labelPrevArppu').textContent   = pm + '同期 ARPPU';
  document.getElementById('labelCurrRevenue').textContent = cm + '累計流水';
  document.getElementById('labelPrevRevenue').textContent = pm + '同期流水';
  document.getElementById('mayPaying').textContent        = fmt(c.may_avg_paying);
  document.getElementById('aprPaying').textContent        = fmt(c.apr_avg_paying);
  document.getElementById('mayArppu').textContent         = '$' + fmtMoney(c.may_avg_arppu);
  document.getElementById('aprArppu').textContent         = '$' + fmtMoney(c.apr_avg_arppu);
  document.getElementById('currRevenue').textContent      = '$' + fmtMoney(c.curr_revenue);
  document.getElementById('prevRevenue').textContent      = '$' + fmtMoney(c.prev_revenue);
  document.getElementById('payingChange').innerHTML       = pct(c.may_avg_paying, c.apr_avg_paying);
  document.getElementById('arppuChange').innerHTML        = pct(c.may_avg_arppu,  c.apr_avg_arppu);
  document.getElementById('revenueChange').innerHTML      = pctDirect(c.revenue_growth_pct);

  // 社交玩家儲值
  const sp    = d.socialPlayers || {};
  const spCur = sp.curr || {};
  const spPrv = sp.prev || {};
  document.getElementById('socialLabelCurrRev').textContent = cm + '社交玩家儲值';
  document.getElementById('socialLabelPrevRev').textContent = pm + '同期儲值';
  document.getElementById('socialCurrRevenue').textContent  = '$' + fmtMoney(spCur.total_recharge || 0);
  document.getElementById('socialPrevRevenue').textContent  = '$' + fmtMoney(spPrv.total_recharge || 0);
  document.getElementById('socialRevenueChange').innerHTML  = pct(spCur.total_recharge, spPrv.total_recharge);

  // 扣掉社交後流水
  const currExSocial = n(c.curr_revenue) - n(spCur.total_recharge);
  const prevExSocial = n(c.prev_revenue) - n(spPrv.total_recharge);
  document.getElementById('labelCurrExSocial').textContent = cm + '扣除社交後流水';
  document.getElementById('currExSocial').textContent      = '$' + fmtMoney(currExSocial);
  document.getElementById('exSocialChange').innerHTML      = pct(currExSocial, prevExSocial);

  // 月份同期儲值品項比較
  document.getElementById('stcAprLabel1').textContent = pm + '付費人數';
  document.getElementById('stcAprLabel2').textContent = pm + '流水';
  document.getElementById('stcMayLabel1').textContent = cm + '付費人數';
  document.getElementById('stcMayLabel2').textContent = cm + '流水';
  const stc = d.saleTypeComparison || [];
  document.getElementById('stcTable').innerHTML = stc.length
    ? stc.map(r => {
        const name = r.name || SALE_TYPE_NAMES[n(r.SaleType)] || `類型${r.SaleType}`;
        return `<tr>
          <td><strong>${name}</strong></td>
          <td class="apr-cell">${fmt(r.apr_paying_users)}</td>
          <td class="may-cell">${fmt(r.may_paying_users)}</td>
          <td class="change-cell">${changeCell(r.may_paying_users, r.apr_paying_users)}</td>
          <td class="apr-cell">$${fmtMoney(r.apr_total_amount)}</td>
          <td class="may-cell">$${fmtMoney(r.may_total_amount)}</td>
          <td class="change-cell">${changeCell(r.may_total_amount, r.apr_total_amount)}</td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="7" style="text-align:center;color:#bbb;padding:16px;">暫無資料</td></tr>';
}

fetch('https://raw.githubusercontent.com/mingyiying850913-crypto/sea-dashboard/main/data.json?t=' + Date.now())
  .then(r => r.json())
  .then(d => { cachedData = d; render(d); })
  .catch(err => {
    document.getElementById('subtitle').textContent = '資料載入失敗：' + err.message;
  });
</script>
</body>
</html>
